    :root {

      --primary-foreground: 0 0% 100%;
      --accent: 38 65% 60%;             /* warm gold #c9913a */
      --surface: 38 15% 91%;            /* warm linen */

    }

      border-color: hsl(var(--border));
      box-sizing: border-box;
    }

    html {

    }

    body {

      color: hsl(var(--foreground));

      font-weight: 400;

      margin: 0;

    }

      font-family: 'Inter', 'Anuphan', sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-in {
      animation: scaleIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;

                    </span>{" "}
                    และ{" "}
                    <span className="text-foreground font-medium">
                      โปสเตอร์สื่อการเรียนรู้
                    </span>
                  </p>

                  {/* 8 Quick Menu Buttons in Hero */}
                  <div className="pt-3 flex flex-wrap items-center justify-center gap-2.5 max-w-4xl mx-auto">
                    {STUDIO_MENUS.map((studio, idx) => {
                      const IconComp = studio.icon;
                      const isPrimary = idx === 0;
                      return (
                        <button
                          key={studio.id}
                          onClick={() => handleOpenStudioPopup(studio)}
                          className={`group inline-flex items-center gap-2 h-10 px-4 rounded-xl text-xs sm:text-sm font-medium transition-all shadow-sm ${
                            isPrimary
                              ? "bg-primary text-primary-foreground hover:opacity-95"
                              : "bg-background text-foreground border border-border hover:bg-surface hover:border-primary/60"
                          }`}
                        >
                          <IconComp className="w-3.5 h-3.5 text-accent shrink-0" />
                          <span>{studio.menuTitle}</span>
                          <Icons.ArrowUpRight className="w-3.5 h-3.5 opacity-75 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </section>

            {/* 8 Menu Cards Section */}
            <section id="studios" className="py-12 md:py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
                <div>
                  <span className="label-eyebrow text-accent block mb-2">
                    SELECT YOUR CREATIVE STUDIO • 9 EDUCATIONAL MENUS
                  </span>
                  <h2 className="font-serif text-3xl sm:text-4xl font-bold text-foreground">
                    เลือกเครื่องมือสร้างสื่อการเรียนรู้{" "}
                    <em className="italic font-normal text-accent">ที่คุณต้องการ</em>
                  </h2>
                </div>
                <p className="text-sm text-muted-foreground max-w-md font-light">
                  คลิกที่เมนูการ์ดด้านล่างเพื่อเปิดหน้าต่าง{" "}
                  <strong className="font-medium text-foreground">Popup Window</strong>{" "}
                  สำหรับใช้งานเครื่องมือและคัดลอก Prompt ได้ทันที
                </p>
              </div>

              {/* Category Filter Tabs & Mobile Search */}
              <div className="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 mb-8 pb-4 border-b border-border/70">
                <div className="flex flex-wrap items-center gap-2">
                  {CATEGORIES.map((cat) => {
                    const isActive = activeCategory === cat.id;
                    return (
                      <button
                        key={cat.id}
                        type="button"
                        onClick={() => setActiveCategory(cat.id)}
                        className={`inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
                          isActive
                            ? "bg-primary text-primary-foreground shadow-sm"
                            : "bg-surface/70 text-foreground hover:bg-surface border border-border/70"
                        }`}
                      >
                        <span>{cat.label}</span>
                        <span
                          className={`px-1.5 py-0.5 rounded-full text-[11px] ${
                            isActive
                              ? "bg-white/20 text-white"
                              : "bg-background text-muted-foreground"
                          }`}
                        >
                          {cat.count}
                        </span>
                      </button>
                    );
                  })}
                </div>

                <div className="relative w-full md:w-64 lg:hidden">
                  <Icons.Search className="w-4 h-4 text-muted-foreground absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="ค้นหาชื่อเมนูหรือคำสำคัญ..."
                    className="w-full h-10 pl-9 pr-4 rounded-xl border border-border bg-white text-xs text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary"
                  />
                </div>
              </div>

              {/* Responsive Cards Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-7 items-stretch">
                {filteredStudios.map((studio) => {
                  const IconComp = studio.icon;
                  return (
                    <div
                      key={studio.id}
                      onClick={() => handleOpenStudioPopup(studio)}
                      role="button"
                      tabIndex={0}
                      onKeyDown={(e) => {
                        if (e.key === "Enter" || e.key === " ") {
                          e.preventDefault();
                          handleOpenStudioPopup(studio);
                        }
                      }}
                      className="group cursor-pointer flex flex-col w-full rounded-2xl border border-border/90 bg-white/95 text-foreground shadow-sm hover:-translate-y-1.5 hover:border-primary/60 hover:shadow-xl hover:shadow-primary/10 transition-all duration-300 overflow-hidden"
                    >
                      {/* Cover Image */}
                      <div className="relative aspect-[16/10] w-full overflow-hidden bg-surface border-b border-border/60">
                        <img
                          src={studio.coverImage}
                          alt={studio.menuTitle}
                          onError={(e) => {
                            const target = e.currentTarget;
                            if (!target.dataset.fallback) {
                              target.dataset.fallback = "true";
                              target.src = studio.fallbackCoverImage;
                            }
                          }}
                          className="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-700 ease-out"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-foreground/80 via-foreground/15 to-transparent" />

                        {/* Top Overlay Badges */}
                        <div className="absolute top-3.5 left-3.5 right-3.5 flex items-center justify-between gap-2">
                          <span className="px-3 py-1 rounded-full bg-background/95 text-primary label-eyebrow shadow-sm backdrop-blur-md">
                            MENU {studio.number} • {studio.accentTag}
                          </span>
                          <span className="w-9 h-9 rounded-full bg-primary text-primary-foreground flex items-center justify-center shadow-md group-hover:bg-accent transition-colors">
                            <IconComp className="w-4 h-4" />
                          </span>
                        </div>

                        {/* Bottom Overlay Info */}
                        <div className="absolute bottom-3 left-3.5 right-3.5 flex items-center justify-between text-white">
                          <p className="text-xs font-medium text-white/90 truncate pr-2">
                            {studio.englishSubtitle}
                          </p>
                          <span className="inline-flex items-center gap-1.5 text-xs font-medium bg-white/20 backdrop-blur-md px-2.5 py-1 rounded-lg border border-white/25 shrink-0">
                            <Icons.AppWindow className="w-3.5 h-3.5 text-accent" />
                            เปิด Popup
                          </span>
                        </div>
                      </div>

                      {/* Card Header */}
                      <div className="flex flex-col space-y-1.5 p-6 pb-3">
                        <div className="flex items-center justify-between gap-2 mb-1">
                          <span className="inline-flex items-center rounded-full border border-accent/30 bg-accent/15 text-[#9a681c] px-3 py-1 label-eyebrow">
                            {studio.badgeText}
                          </span>
                        </div>
                        <h3 className="font-serif text-xl sm:text-2xl font-semibold leading-tight tracking-tight text-foreground group-hover:text-primary transition-colors flex items-start justify-between gap-2 pt-1">
                          <span>{studio.menuTitle}</span>
                          <Icons.ArrowUpRight className="w-5 h-5 text-accent shrink-0 mt-1 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" />
                        </h3>
                        <p className="text-sm text-muted-foreground pt-1.5 leading-relaxed font-light">
                          {studio.description}
                        </p>
                      </div>

                      {/* Card Highlights */}
                      <div className="p-6 pt-0 flex-1 flex flex-col justify-between space-y-4">
                        <ul className="space-y-2 text-xs sm:text-sm text-foreground/85">
                          {studio.highlights.map((point, i) => (
                            <li key={i} className="flex items-start gap-2.5">
                              <Icons.CheckCircle2 className="w-4 h-4 text-accent shrink-0 mt-0.5" />
                              <span>{point}</span>
                            </li>
                          ))}
                        </ul>

                        <div className="pt-3 border-t border-border/60">
                          <span className="label-eyebrow text-muted-foreground block mb-1">
                            เหมาะสำหรับ (IDEAL FOR)
                          </span>
                          <p className="text-xs font-medium text-primary">
                            {studio.idealFor}
                          </p>
                        </div>
                      </div>

                      {/* Card Footer Buttons */}
                      <div className="flex flex-col sm:flex-row items-center gap-2.5 p-6 pt-2">
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            handleOpenStudioPopup(studio);
                          }}
                          className="w-full sm:flex-1 h-11 px-5 py-2.5 rounded-xl bg-primary text-primary-foreground text-sm font-medium inline-flex items-center justify-center gap-2 shadow-sm hover:opacity-95 transition-all"
                        >
                          <Icons.Play className="w-3.5 h-3.5 shrink-0" />
                          <span className="truncate">เปิดเมนูนี้</span>
                        </button>
                        <button
                          type="button"
                          onClick={(e) =>
                            handleOpenBrowserPopupWindow(
                              studio.fileUrl,
                              studio.menuTitle,
                              e
                            )
                          }
                          title={`เปิดหน้าต่างแยก (${studio.fileName})`}
                          className="w-full sm:w-auto h-11 px-3.5 rounded-xl border border-border bg-background hover:bg-surface text-foreground text-xs font-medium inline-flex items-center justify-center gap-1.5 transition-all shrink-0"
                        >
                          <Icons.ExternalLink className="w-3.5 h-3.5 text-accent" />
                          <span>หน้าต่างแยก</span>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer className="bg-background border-t border-border py-8">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-4 text-xs text-muted-foreground">
              <div className="flex items-center gap-2.5 shrink-0">
                <div className="w-7 h-7 rounded-lg bg-primary text-primary-foreground flex items-center justify-center">
                  <Icons.Sparkles className="w-3.5 h-3.5 text-accent" />
                </div>
                <span className="font-serif font-semibold text-foreground text-sm">
                  AI Prompt Generator{" "}
                  <em className="italic font-normal text-accent">for Education</em>
                </span>
              </div>
              <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-2">
                {STUDIO_MENUS.map((s) => (
                  <button
                    key={s.id}
                    onClick={() => handleOpenStudioPopup(s)}
                    className="hover:text-primary underline-offset-4 hover:underline transition-colors"
                  >
                    {s.menuTitle}
                  </button>
                ))}
              </div>
            </div>
          </footer>

          {/* Interactive Popup Window Modal */}
          {selectedStudio && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center bg-foreground/60 backdrop-blur-sm p-2 sm:p-4"
              onClick={() => setSelectedStudio(null)}
              role="dialog"
              aria-modal="true"
              aria-labelledby="popup-window-title"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`animate-scale-in bg-background border border-border rounded-2xl shadow-2xl flex flex-col overflow-hidden transition-all ${
                  isFullscreenModal
                    ? "w-[99vw] h-[96vh]"
                    : "w-[96vw] max-w-6xl h-[90vh]"
                }`}
              >
                {/* Popup Top Bar */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 px-5 py-3.5 bg-surface border-b border-border">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="label-eyebrow text-accent">
                        MENU {selectedStudio.number} • POPUP STUDIO WINDOW
                      </span>
                      <span className="text-xs text-muted-foreground hidden md:inline">
                        ({selectedStudio.fileName})
                      </span>
                    </div>
                    <h2
                      id="popup-window-title"
                      className="font-serif text-lg sm:text-xl font-semibold text-foreground flex items-center gap-2"
                    >
                      <span>{selectedStudio.menuTitle}</span>
                      <span className="text-xs font-sans font-normal text-muted-foreground hidden sm:inline">
                        — {selectedStudio.englishSubtitle}
                      </span>
                    </h2>
                  </div>

                  {/* Popup Toolbar Actions */}
                  <div className="flex flex-wrap items-center gap-2">
                    {activeIframeUrl !== selectedStudio.fileUrl && (
                      <button
                        type="button"
                        onClick={() => {
                          setActiveIframeUrl(selectedStudio.fileUrl);
                          setActiveIframeTitle(selectedStudio.menuTitle);
                        }}
                        className="h-9 px-3.5 rounded-lg bg-primary text-primary-foreground text-xs font-medium inline-flex items-center gap-1.5 shadow-sm hover:opacity-95"
                      >
                        <Icons.Wand2 className="w-3.5 h-3.5" />
                        <span>กลับหน้าเครื่องมือหลัก</span>
                      </button>
                    )}

                    <button
                      type="button"
                      onClick={() =>
                        handleOpenBrowserPopupWindow(
                          activeIframeUrl,
                          activeIframeTitle
                        )
                      }
                      className="h-9 px-3.5 rounded-lg border border-border bg-background hover:bg-surface text-foreground text-xs font-medium inline-flex items-center gap-1.5 transition-colors"
                    >
                      <Icons.AppWindow className="w-3.5 h-3.5 text-primary" />
                      <span>เปิดเป็นหน้าต่างแยก (Popup)</span>
                    </button>

                    <a
                      href={activeIframeUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="h-9 px-3.5 rounded-lg border border-border bg-background hover:bg-surface text-foreground text-xs font-medium inline-flex items-center gap-1.5 transition-colors"
                    >
                      <Icons.ExternalLink className="w-3.5 h-3.5 text-accent" />
                      <span>เปิดในแท็บใหม่</span>
                    </a>

                    <button
                      type="button"
                      onClick={() => setIsFullscreenModal((prev) => !prev)}
                      className="hidden sm:inline-flex h-9 w-9 items-center justify-center rounded-lg border border-border bg-background hover:bg-surface text-foreground transition-colors"
                      title={isFullscreenModal ? "ย่อขนาดหน้าต่าง" : "ขยายเต็มจอ"}
                    >
                      {isFullscreenModal ? (
                        <Icons.Minimize2 className="w-4 h-4" />
                      ) : (
                        <Icons.Maximize2 className="w-4 h-4" />
                      )}
                    </button>

                    <button
                      type="button"
                      onClick={() => setSelectedStudio(null)}
                      className="h-9 w-9 inline-flex items-center justify-center rounded-lg bg-primary/10 hover:bg-primary text-primary hover:text-primary-foreground transition-colors"
                      title="ปิดหน้าต่าง (Esc)"
                      aria-label="Close Popup Window"
                    >
                      <Icons.X className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {/* Bonus Examples Bar (if studio has showcase examples) */}
                {selectedStudio.examples && selectedStudio.examples.length > 0 && (
                  <div className="px-5 py-2 bg-background border-b border-border flex items-center gap-2 overflow-x-auto text-xs">
                    <span className="label-eyebrow text-primary shrink-0 flex items-center gap-1">
                      <Icons.BookOpen className="w-3.5 h-3.5 text-accent" />
                      สลับดูตัวอย่างในหมวดนี้:
                    </span>
                    <button
                      type="button"
                      onClick={() => {
                        setActiveIframeUrl(selectedStudio.fileUrl);
                        setActiveIframeTitle(selectedStudio.menuTitle);
                      }}
                      className={`px-2.5 py-1 rounded-lg font-medium shrink-0 transition-colors ${
                        activeIframeUrl === selectedStudio.fileUrl
                          ? "bg-primary text-primary-foreground"
                          : "bg-surface text-foreground hover:bg-border/60"
                      }`}
                    >
                      ★ เครื่องมือสร้าง Prompt ({selectedStudio.fileName})
                    </button>
                    {selectedStudio.examples.map((ex, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => {
                          setActiveIframeUrl(ex.url);
                          setActiveIframeTitle(ex.title);
                        }}
                        className={`px-2.5 py-1 rounded-lg font-medium shrink-0 transition-colors ${
                          activeIframeUrl === ex.url
                            ? "bg-accent text-white"
                            : "bg-surface/70 text-foreground hover:bg-surface"
                        }`}
                      >
                        {ex.title}
                      </button>
                    ))}
                  </div>
                )}

                {/* Embedded Interactive Iframe or External Popup Launch Card */}
                <div className="flex-1 w-full bg-white relative overflow-hidden">
                  {selectedStudio.cannotEmbedInIframe ? (
                    <div className="w-full h-full bg-background flex items-center justify-center p-6 overflow-y-auto">
                      <div className="max-w-2xl w-full rounded-2xl border border-border bg-white shadow-lg overflow-hidden">
                        <div className="relative aspect-[16/9] w-full bg-surface border-b border-border overflow-hidden">
                          <img
                            src={selectedStudio.coverImage}
                            alt={selectedStudio.menuTitle}
                            onError={(e) => {
                              const target = e.currentTarget;
                              if (!target.dataset.fallback) {
                                target.dataset.fallback = "true";
                                target.src = selectedStudio.fallbackCoverImage;
                              }
                            }}
                            className="w-full h-full object-cover object-center"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-foreground/80 via-foreground/20 to-transparent" />
                          <div className="absolute bottom-4 left-5 right-5 text-white">
                            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-accent text-white label-eyebrow mb-2 shadow-sm">
                              <Icons.AppWindow className="w-3.5 h-3.5" />
                              EXTERNAL STUDIO POPUP WINDOW
                            </span>
                            <h3 className="font-serif text-2xl font-bold">
                              {selectedStudio.menuTitle}
                            </h3>
                            <p className="text-xs text-white/85">
                              {selectedStudio.englishSubtitle} • {selectedStudio.fileName}
                            </p>
                          </div>
                        </div>
                        <div className="p-6 space-y-5">
                          <div className="p-4 rounded-xl bg-surface/70 border border-border text-sm text-foreground leading-relaxed">
                            ระบบได้เปิดหน้าต่างแยก (Popup Window) สำหรับ{" "}
                            <strong className="text-primary font-semibold">
                              {selectedStudio.menuTitle}
                            </strong>{" "}
                            แล้ว (เนื่องจากเว็บไซต์ Canva ไม่อนุญาตให้แสดงผลผ่านกรอบ Iframe ภายในหน้าเว็บอื่นโดยตรง) หากหน้าต่างไม่เด้งขึ้นมา สามารถคลิกปุ่มด้านล่างเพื่อเปิดใช้งานได้ทันทีครับ
                          </div>
                          <ul className="space-y-2 text-sm text-muted-foreground">
                            {selectedStudio.highlights.map((h, i) => (
                              <li key={i} className="flex items-start gap-2.5">
                                <Icons.CheckCircle2 className="w-4 h-4 text-accent shrink-0 mt-0.5" />
                                <span>{h}</span>
                              </li>
                            ))}
                          </ul>
                          <div className="flex flex-col sm:flex-row items-center gap-3 pt-2">
                            <button
                              type="button"
                              onClick={() =>
                                handleOpenBrowserPopupWindow(
                                  selectedStudio.fileUrl,
                                  selectedStudio.menuTitle
                                )
                              }
                              className="w-full sm:flex-1 h-12 px-6 rounded-xl bg-primary text-primary-foreground text-sm font-medium inline-flex items-center justify-center gap-2 shadow-md hover:opacity-95 transition-all"
                            >
                              <Icons.AppWindow className="w-4 h-4 text-accent" />
                              <span>เปิดหน้าต่าง Popup เครื่องมือนี้</span>
                            </button>
                            <a
                              href={selectedStudio.fileUrl}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="w-full sm:w-auto h-12 px-6 rounded-xl border border-border bg-background hover:bg-surface text-foreground text-sm font-medium inline-flex items-center justify-center gap-2 transition-all"
                            >
                              <Icons.ExternalLink className="w-4 h-4 text-accent" />
                              <span>เปิดในแท็บใหม่</span>
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                  ) : (
                    <iframe
                      key={activeIframeUrl}
                      src={activeIframeUrl}
                      title={activeIframeTitle}
                      className="w-full h-full border-0"
                      allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
                    />
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
