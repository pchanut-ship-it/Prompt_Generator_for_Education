 $("#app").innerHTML=`<section class="panel"><p class="eyebrow">บันทึกการเรียนรู้ · ${Math.round(state.elapsed/60)} นาที</p><h1>สวนของเรา เล่าอะไรได้บ้าง?</h1><p>สำเร็จหลังฝึก ${s.mastered}/${s.answerMax} ข้อ · ยังไม่ยืนยัน ${s.answerMax-s.submitted} ข้อ · แก้ได้หลังคำแนะนำ ${corrected} ข้อ</p><div class="metrics"><div class="metric"><b>${s.answer}/${s.answerMax}</b>คำตอบครั้งแรก</div><div class="metric"><b>${s.reason}/${s.reasonMax}</b>เหตุผลครั้งแรก</div><div class="metric"><b>${s.answer+s.reason}/${s.answerMax+s.reasonMax}</b>คะแนนจากคำตอบและเหตุผล</div></div><p class="smalltext">ใช้ครั้งแรกที่กดยืนยัน ไม่ใช้ความเร็วหรือทักษะมือ เหตุผลครบ 2 / เกี่ยวข้องแต่ยังไม่ครบ 1 / ผิดหลัก 0 คะแนน ข้อที่ยังไม่ทำแสดงแยกและไม่บันทึกเป็นความเข้าใจผิด</p><h3 class="spaced">ประเด็นที่ควรคุยต่อกับครู</h3>${Object.keys(s.counts).length?`<div class="scroll"><table><thead><tr><th>ประเด็นจากคำตอบ</th><th>ครั้ง</th><th>ชวนคิดต่อ</th></tr></thead><tbody>${Object.entries(s.counts).map(([id,n])=>{const c=CATEGORIES.find(c=>c.id===id);return `<tr><td>${esc(c?.name||id)}</td><td>${n}</td><td>${esc(c?.review||"")}</td></tr>`}).join("")}</tbody></table></div>`:"<p>ยังไม่พบประเด็นจากคำตอบผิดที่ยืนยัน ใช้คำอธิบายและจำนวนข้อที่ทำประกอบการพิจารณา</p>"}<p class="smalltext spaced">รายการนี้เป็นประเด็นที่พบในรอบนี้ ไม่ใช่การวินิจฉัยความเข้าใจของผู้เรียนอย่างถาวร</p><details><summary>ดูคำตอบและเหตุผลทุกครั้ง</summary><div class="scroll"><table><thead><tr><th>ข้อ / ครั้ง</th><th>คำตอบ</th><th>เหตุผล / ข้อความเพิ่ม</th><th>ผล</th></tr></thead><tbody>${state.log.map(e=>`<tr><td>${esc(e.key)} / ${e.attempt}</td><td>${esc(e.answer)}</td><td>${esc(e.reason||"–")}<br>${esc(e.note)}</td><td>${e.answerCorrect?"ถูก":"ลองใหม่"}${e.reasonScore!==null?` · เหตุผล ${e.reasonScore}/2`:""}</td></tr>`).join("")}</tbody></table></div></details><div class="row spaced">${btn("ดาวน์โหลดผล JSON","export","primary")}${btn("เริ่มรอบใหม่ · ล้างผลเดิม","restart")}</div><p class="smalltext spaced">ผลอยู่ในหน่วยความจำของหน้านี้ ดาวน์โหลดก่อนปิดหรือเริ่มรอบใหม่ ไม่มีภาพหรือพิกัดมืออยู่ในไฟล์ผล</p></section>`;

function finish(){state.screen="summary";state.paused=false;$("#modal").hidden=true;stopCamera();render()}
function exportResults(){const payload={lesson:LESSON.title,version:LESSON.version,exportedAt:new Date().toISOString(),score:summaryData(),elapsedSeconds:Math.round(state.elapsed),palette:colors,colorSources,categoryDefinitions:CATEGORIES,completed:[...state.done],responses:state.log,scoring:"First confirmed answers; answer 0/1, reason 0/1/2; typed notes require teacher review; no speed score"}, a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));a.download="plant-learning-results.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function pause(time=false){state.paused=true;cancelDrag();resetHand();$("#modal").hidden=false;$("#modal").innerHTML=`<section class="panel"><h2>${time?"ครบเวลาที่กำหนดแล้ว":"พักสักครู่"}</h2><p>${time?"สรุปสิ่งที่ทำแล้ว หรือเพิ่มเวลาได้ คะแนนไม่ขึ้นกับเวลา":"เมื่อพร้อม คลายนิ้วก่อน แล้วเล่นต่อได้"}</p><div class="row">${btn(time?"เพิ่มเวลา 2 นาที":"เล่นต่อ",time?"extend":"resume","primary")}${btn("สรุปผลตอนนี้","finish")}</div></section>`}
function updateClock(){const e=$("#clock"),n=Math.max(0,Math.ceil(state.limit-state.elapsed));if(e)e.textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`}
function printSheet(){ $("#worksheet").innerHTML=`<h1>พืชของฉัน · ระบายสีก่อนเล่น</h1><p>ระบายสีราก ลำต้น ใบ และดอก แล้วชี้บอกชื่อแต่ละส่วน</p>${plantSVG(PARTS.map(p=>p.id),true)}<p class="printline">ชื่อเล่น ____________  สิ่งที่อยากรู้เกี่ยวกับพืช ____________________</p>`;window.print() }
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b||b.disabled)return;
 if(b.dataset.drag&&e.detail===0){selectSource(b.dataset.drag);return}
 if(b.dataset.drop&&state.selected){propose(state.selected,b.dataset.drop);return}
 if(b.dataset.part){state.colorPart=b.dataset.part;render();return}
 if(b.dataset.answer){state.answer=b.dataset.answer;render();return}
 if(b.dataset.reason){state.reason=b.dataset.reason;render();return}
 switch(b.dataset.action){
  case "start-camera":state.screen="tutorial";render();startCamera();break;
  case "start-mouse":state.screen="tutorial";stopCamera();render();break;
  case "camera":startCamera();break;case "mouse":stopCamera();toolbar();status("ใช้เมาส์หรือแตะจอได้แล้ว");if(state.screen==="tutorial")render();break;
  case "skeleton":showSkeleton=!showSkeleton;drawHandSkeleton([]);toolbar();break;
  case "fullscreen":if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>status("เปิดเต็มจอไม่ได้ ใช้ปุ่ม F11 ใน Chrome ได้"));else document.exitFullscreen?.();break;
  case "print":printSheet();break;case "sample":sampleColor();break;
  case "scroll-up":window.scrollBy({top:-Math.max(260,innerHeight*.55),behavior:"smooth"});break;case "scroll-down":window.scrollBy({top:Math.max(260,innerHeight*.55),behavior:"smooth"});break;
  case "play":state.screen="game";state.elapsed=0;state.limit=LESSON.seconds;clearQuestion();render();window.scrollTo(0,0);break;
  case "confirm":confirmPlacement();break;case "clear":state.pending=null;state.feedback="";render();break;
  case "next-stage":nextStage();break;case "submit":submitQuestion();break;
  case "next-question":if(state.qi+1<QUESTIONS.filter(q=>q.stage===stage().id).length){state.qi++;clearQuestion();render();window.scrollTo(0,0)}else if(state.stage===STAGES.length-1)finish();else nextStage();break;
  case "pause":pause();break;case "extend":state.limit+=120;case "resume":state.paused=false;$("#modal").hidden=true;resetHand();break;
  case "finish":finish();break;case "export":exportResults();break;
  case "restart":orders=cardOrders();state={...state,screen:"start",stage:0,qi:0,done:new Set(),log:[],first:{},elapsed:0,limit:LESSON.seconds,pending:null,paused:false,practice:false};clearQuestion();render();break;
 }
});
/* ===== ช่องทางปฏิสัมพันธ์: เลือก/ลาก ≠ ยืนยันคำตอบ ===== */
function beginDrag(el,x,y,input){if(el.disabled)return;cancelDrag();const ghost=el.cloneNode(true);ghost.removeAttribute("id");ghost.classList.add("ghost");ghost.disabled=false;ghost.setAttribute("aria-hidden","true");document.body.append(ghost);el.classList.add("held");drag={id:el.dataset.drag,el,ghost,input,startX:x,startY:y};moveDrag(x,y)}
function moveDrag(x,y){if(!drag)return;drag.ghost.style.left=x+"px";drag.ghost.style.top=y+"px";$$('[data-drop]').forEach(e=>e.classList.remove("hover"));document.elementFromPoint(x,y)?.closest("[data-drop]")?.classList.add("hover")}
function cancelDrag(){if(drag){drag.el.classList.remove("held");drag.ghost.remove();drag=null}$$('[data-drop]').forEach(e=>e.classList.remove("hover"));handButton=null;pointerId=null}
function endDrag(x,y){if(!drag)return;const d=drag, target=document.elementFromPoint(x,y)?.closest("[data-drop]"),same=document.elementFromPoint(x,y)?.closest("[data-drag]");cancelDrag();if(target)propose(d.id,target.dataset.drop);else if(same===d.el&&Math.hypot(x-d.startX,y-d.startY)<18)selectSource(d.id);else status("ยังไม่วางลงเป้าหมาย ลองหยิบใหม่ได้ ไม่เสียคะแนน")}
document.addEventListener("pointerdown",e=>{const el=e.target.closest("[data-drag]");if(!el||el.disabled||e.button!==0||state.paused)return;resetHand();e.preventDefault();beginDrag(el,e.clientX,e.clientY,"pointer");pointerId=e.pointerId;el.setPointerCapture?.(e.pointerId)});
document.addEventListener("pointermove",e=>{if(drag?.input==="pointer"&&e.pointerId===pointerId)moveDrag(e.clientX,e.clientY)});
document.addEventListener("pointerup",e=>{if(drag?.input==="pointer"&&e.pointerId===pointerId){e.preventDefault();endDrag(e.clientX,e.clientY)}});
document.addEventListener("pointercancel",()=>{cancelDrag();resetHand()});
function handPress(x,y){const e=document.elementFromPoint(x,y);if(e?.closest("[data-drag]")&&!state.paused)beginDrag(e.closest("[data-drag]"),x,y,"hand");else handButton=e?.closest("button")||null}
function handRelease(x,y){if(drag?.input==="hand")endDrag(x,y);else{const b=document.elementFromPoint(x,y)?.closest("button");if(b&&b===handButton&&!b.disabled)b.click();handButton=null}}
/* ===== ภาพกล้องและโครงมือ: ใช้การแปลง cover+mirror ร่วมกัน ===== */
function resizeOverlay(){const r=$("#cameraLayer").getBoundingClientRect(),vw=video.videoWidth||1280,vh=video.videoHeight||720,s=Math.max(r.width/vw,r.height/vh),dpr=window.devicePixelRatio||1;map={w:r.width,h:r.height,s,ox:(r.width-vw*s)/2,oy:(r.height-vh*s)/2,left:r.left,top:r.top};canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawHandSkeleton([])}
function point(p){return {x:map.w-(p.x*(video.videoWidth||1280)*map.s+map.ox),y:p.y*(video.videoHeight||720)*map.s+map.oy}}
function drawHandSkeleton(hands){
 ctx.clearRect(0,0,map.w,map.h);if(!showSkeleton||!HandClass)return;
 for(const landmarks of hands){ctx.strokeStyle="#FFF59D";ctx.lineWidth=2;for(const c of HandClass.HAND_CONNECTIONS){const a=point(landmarks[c.start]),b=point(landmarks[c.end]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.fillStyle="#FFC107";for(const l of landmarks){const p=point(l);ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()}}
}
function palmSize(l){const d=(a,b)=>Math.hypot((l[a].x-l[b].x)*video.videoWidth,(l[a].y-l[b].y)*video.videoHeight);return {size:Math.max(d(0,9),d(5,17),1),pinch:d(4,8)}}
function resetHand(){if(drag?.input==="hand")cancelDrag();handButton=null;hand={wrist:null,last:0,x:0,y:0,armed:false,pinch:false,closeAt:0,openAt:0,acquire:0};cursor.style.display="none";cursor.classList.remove("pinch")}
function updateHandControl(hands,now){
 if(drag?.input==="pointer")return;
 if(!hands.length){resetHand();status("ไม่พบมือ: ชูทั้งฝ่ามือให้กล้องเห็น เพิ่มแสงด้านหน้า หรือเลือกเมาส์ / แตะ");return}
 let candidates=hands.map(l=>({l,p:palmSize(l)})).filter(h=>h.p.size>video.videoWidth*.045), chosen;
 if(hand.wrist){candidates.sort((a,b)=>Math.hypot(a.l[0].x-hand.wrist.x,a.l[0].y-hand.wrist.y)-Math.hypot(b.l[0].x-hand.wrist.x,b.l[0].y-hand.wrist.y));chosen=candidates[0];if(!chosen||Math.hypot(chosen.l[0].x-hand.wrist.x,chosen.l[0].y-hand.wrist.y)>.20){resetHand();status("มือที่ใช้เล่นหลุดกรอบ คลายนิ้วแล้วชูมือเดิมอีกครั้ง");return}}
 else chosen=candidates.sort((a,b)=>b.p.size-a.p.size)[0];
 if(!chosen){resetHand();status("ขยับมือเข้าใกล้กล้องอีกนิด ให้เห็นทั้งฝ่ามือ");return}
 const l=chosen.l,p=point(l[8]),fresh=!hand.wrist;hand.wrist={x:l[0].x,y:l[0].y};hand.last=now;if(fresh){hand.x=p.x;hand.y=p.y;hand.acquire=now}
 const alpha=1-Math.exp(-Math.min(100,now-(hand.moveAt||now-33))/55);hand.moveAt=now;hand.x+=(p.x-hand.x)*alpha;hand.y+=(p.y-hand.y)*alpha;
 const x=hand.x+map.left,y=hand.y+map.top;cursor.style.display="block";cursor.style.left=x+"px";cursor.style.top=y+"px";moveDrag(x,y);
 const ratio=chosen.p.pinch/chosen.p.size;
 if(!hand.armed){if(ratio>TECH.open&&now-hand.acquire>200)hand.armed=true;status("คลายนิ้วโป้งกับนิ้วชี้ แล้วชี้ไปที่บัตรหรือปุ่ม");return}
 if(!hand.pinch){if(ratio<TECH.close){if(!hand.closeAt)hand.closeAt=now;if(now-hand.closeAt>=TECH.holdMs){hand.pinch=true;hand.closeAt=0;handPress(x,y)}}else hand.closeAt=0}
 else if(ratio>TECH.open){if(!hand.openAt)hand.openAt=now;if(now-hand.openAt>=TECH.holdMs){hand.pinch=false;hand.openAt=0;handRelease(x,y)}}else hand.openAt=0;
 cursor.classList.toggle("pinch",hand.pinch);status(hand.pinch?"กำลังคีบ · ลากไปที่เป้าหมาย แล้วคลายนิ้ว":hands.length>1?"พบหลายมือ · ใช้มือเดิมเล่น คนอื่นเว้นระยะจากกล้อง":"พร้อม · คีบเพื่อหยิบ คลายนิ้วเพื่อปล่อย");
}
function stopCamera(){generation++;loading=false;cameraOn=false;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;detector?.close();detector=null;lastVideoTime=-1;drawHandSkeleton([]);cancelDrag();resetHand();status("พร้อมเล่นด้วยเมาส์หรือแตะจอ")}
async function startCamera(){
 if(cameraOn||loading)return;const token=++generation;loading=true;toolbar();status("กำลังขอสิทธิ์กล้องและโหลดระบบมือ… เลือกเมาส์ได้ตลอดเวลา");let localStream=null,localDetector=null;let phase="camera";
 try{
  if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error("SECURE");
  localStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30},facingMode:"user"},audio:false});
  if(token!==generation){localStream.getTracks().forEach(t=>t.stop());return}stream=localStream;video.srcObject=stream;await video.play();resizeOverlay();phase="model";
  const {HandLandmarker,FilesetResolver}=await import(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TECH.version}/vision_bundle.mjs`);
  if(token!==generation)return;HandClass=HandLandmarker;const files=await FilesetResolver.forVisionTasks(`https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${TECH.version}/wasm`);
  if(token!==generation)return;
  const options={baseOptions:{modelAssetPath:TECH.model,delegate:"GPU"},runningMode:"VIDEO",numHands:TECH.numHands,minHandDetectionConfidence:.6,minHandPresenceConfidence:.6,minTrackingConfidence:.6};
  try{localDetector=await HandLandmarker.createFromOptions(files,options)}catch{if(token!==generation)return;options.baseOptions.delegate="CPU";localDetector=await HandLandmarker.createFromOptions(files,options)}
  if(token!==generation){localDetector?.close();return}detector=localDetector;cameraOn=true;loading=false;lastVideoTime=-1;lastFrameAt=performance.now();resetHand();
  stream.getVideoTracks()[0].addEventListener("ended",()=>{if(token===generation){stopCamera();toolbar();status("กล้องหยุดทำงาน เล่นต่อด้วยเมาส์หรือแตะได้")}});toolbar();if(state.screen==="tutorial")render();status("กล้องพร้อม · ชูมือและคลายนิ้วก่อนเริ่ม");
 }catch(error){
  if(token!==generation)return;localDetector?.close();stopCamera();toolbar();if(state.screen==="tutorial")render();
  const messages={NotAllowedError:"ไม่ได้รับสิทธิ์กล้อง เลือกอนุญาตกล้องใน Chrome แล้วลองใหม่ได้",NotFoundError:"ไม่พบเว็บแคม ตรวจการเชื่อมต่อกล้อง",NotReadableError:"เปิดกล้องไม่ได้ กล้องอาจถูกใช้งานโดยโปรแกรมอื่น",SecurityError:"นโยบายเครื่องไม่อนุญาตให้ใช้กล้อง"};status((error.message==="SECURE"?"เปิดไฟล์ใน Chrome โดยตรง หรือผ่าน HTTPS เพื่อใช้กล้อง":phase==="model"?"โหลดระบบมือหรือโมเดลไม่สำเร็จ ตรวจอินเทอร์เน็ตและการเข้าถึง CDN":messages[error.name]||"เปิดกล้องไม่สำเร็จ ตรวจสิทธิ์และการเชื่อมต่อ")+" · เปลี่ยนเป็นเมาส์ / แตะแล้ว");
 }finally{if(token!==generation){localStream?.getTracks().forEach(t=>t.stop())}}
}
function sampleColor(){
 if(!cameraOn||video.readyState<2)return;const r=$("#sampleTarget").getBoundingClientRect(),x=r.left+r.width/2-map.left,y=r.top+r.height/2-map.top;
 const sx=(map.w-x-map.ox)/map.s,sy=(y-map.oy)/map.s,c=document.createElement("canvas");c.width=c.height=1;
 try{const context=c.getContext("2d",{willReadFrequently:true});context.drawImage(video,Math.max(0,Math.min(video.videoWidth-12,sx-6)),Math.max(0,Math.min(video.videoHeight-12,sy-6)),12,12,0,0,1,1);const rgb=context.getImageData(0,0,1,1).data;colors[state.colorPart]="#"+[...rgb].slice(0,3).map(n=>n.toString(16).padStart(2,"0")).join("");colorSources[state.colorPart]="camera";context.clearRect(0,0,1,1);c.width=c.height=0;render();status("รับเฉพาะค่าสีแล้ว ไม่มีการเก็บภาพ")}
 catch{status("รับสีไม่สำเร็จ เลือกสีด้วยตนเองให้ตรงผลงานได้")}
}
let lastTick=performance.now();
function frame(now){
 const dt=Math.max(0,(now-lastTick)/1000);lastTick=now;
 if(state.screen==="game"&&!state.paused&&!document.hidden){state.elapsed+=dt;updateClock();if(state.elapsed>=state.limit)pause(true)}
 if(cameraOn&&detector&&!document.hidden){
  if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;lastFrameAt=now;try{const result=detector.detectForVideo(video,now);drawHandSkeleton(result.landmarks);updateHandControl(result.landmarks,now)}catch{stopCamera();toolbar();status("ระบบตรวจมือขัดข้อง เปลี่ยนเป็นเมาส์ / แตะแล้ว ลองเปิดกล้องใหม่ได้")}}
  else if(now-lastFrameAt>600){drawHandSkeleton([]);resetHand();status("ภาพกล้องหยุดชั่วคราว ตรวจกล้องหรือใช้เมาส์ / แตะ")}
 }
 requestAnimationFrame(frame);
}
window.addEventListener("resize",resizeOverlay);video.addEventListener("loadedmetadata",resizeOverlay);new ResizeObserver(resizeOverlay).observe($("#cameraLayer"));
document.addEventListener("visibilitychange",()=>{cancelDrag();resetHand();drawHandSkeleton([]);lastTick=performance.now();if(document.hidden&&state.screen==="game"&&!state.paused)pause()});window.addEventListener("blur",()=>{cancelDrag();resetHand();drawHandSkeleton([])});window.addEventListener("pagehide",stopCamera);
resizeOverlay();render();requestAnimationFrame(frame);
</script>
